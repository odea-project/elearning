- id: rv01
  title: "Roll a D20 Dice"
  task: |
    Complete the code to roll a 20-sided dice (d20) and display the result.
  starter_code: |
    result <- sample(1:..., 1)
    print(...)
  solution: |
    result <- sample(1:20, 1)
    print(result)
  expected_output: |
    # Any number between 1 and 20

- id: rv02
  title: "Roll Multiple Dice"
  task: |
    Roll three 6-sided dice and display all results.
  starter_code: |
    results <- sample(1:6, ..., replace = TRUE)
    print(...)
  solution: |
    results <- sample(1:6, 3, replace = TRUE)
    print(results)
  expected_output: |
    # Three numbers between 1 and 6

- id: rv03
  title: "Sum of Two Dice"
  task: |
    Roll two 6-sided dice and calculate their sum.
  starter_code: |
    dice_1 <- sample(1:6, 1)
    dice_2 <- sample(...)
    total <- ...
    print(...)
  solution: |
    dice_1 <- sample(1:6, 1)
    dice_2 <- sample(1:6, 1)
    total <- dice_1 + dice_2
    print(total)
  expected_output: |
    You rolled: # Any number between 2 and 12
