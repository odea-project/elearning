- id: rv01
  title: "Roll a D20 Dice"
  task: |
    Complete the code to roll a 20-sided dice (d20) and display the result.
  starter_code: |
    # Set seed for reproducibility
    set.seed(123)

    result <- sample(1:..., 1)
    print(...)
  solution: |
    # Set seed for reproducibility
    set.seed(123)

    result <- sample(1:20, 1)
    print(result)
  expected_output: |
    [1] 15

- id: rv02
  title: "Roll Multiple Dice"
  task: |
    Roll three 6-sided dice and display all results.
  starter_code: |
    # Set seed for reproducibility
    set.seed(123)

    results <- sample(1:6, ..., replace = TRUE)
    print(...)
  solution: |
    # Set seed for reproducibility
    set.seed(123)

    results <- sample(1:6, 3, replace = TRUE)
    print(results)
  expected_output: |
    [1] 3 6 3

- id: rv03
  title: "Sum of Two Dice"
  task: |
    Roll two 6-sided dice and calculate their sum.
  starter_code: |
    # Set seed for reproducibility
    set.seed(123)

    dice_1 <- sample(1:6, 1)
    dice_2 <- sample(...)
    total <- ...
    print(...)
  solution: |
    # Set seed for reproducibility
    set.seed(123)
    
    dice_1 <- sample(1:6, 1)
    dice_2 <- sample(1:6, 1)
    total <- dice_1 + dice_2
    print(total)
  expected_output: |
    [1] 9
