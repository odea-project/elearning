<div id="overworld"></div>
<script>
const gridWidth = 50;
const gridHeight = 1;
const numLevels = 1;

function createHexGrid(width, height) {
    const grid = [];
    const height_scale = 10;
    let h = (Math.random()-.5) * height_scale;
    let len_grid = 0;
    for (let r = 0; r < height; r++) {
        for (let q = 0; q < width; q += 2) {
            h += (Math.random()-.5) * height_scale;
            grid.push({ q, r, h, type: "land" });
            len_grid++;
        }
        for (let q = 1; q < width; q += 2) {
            h = grid[len_grid - Math.floor(width / 2)].h  + (Math.random()-.5) * height_scale;
            grid.push({ q, r, h, type: "land" });
            len_grid++;
        }
    }
    return grid;
}

// Simple random path generator for demonstration
function createRandomPath(grid, width, height, numLevels) {
    let path = [];
    let current = { q: 1, r: Math.floor(height / 2) };
    path.push(current);
    let r_increment = current.q % 2 === 0 ? 0 : 1;

    while (path.length < numLevels) {
        let options = [
            { q: current.q + 1, r: current.r },
            { q: current.q + 1, r: current.r + r_increment},
            { q: current.q + 1, r: current.r + (r_increment-1)},
            { q: current.q, r: current.r + r_increment},
            { q: current.q, r: current.r - r_increment},
        ].filter(({ q, r }) =>
            q >= 0 && q < width && r >= 0 && r < height
        );
        let next = options[Math.floor(Math.random() * options.length)];
        if (!path.find(p => p.q === next.q && p.r === next.r)) {
            path.push(next);
            current = next;
            r_increment = current.q % 2 === 0 ? 0 : 1;
        }
    }
    return path;
}

function setGridTypes(grid, path) {
    path.forEach((node, i) => {
        let cell = grid.find(g => g.q === node.q && g.r === node.r);
        if (cell) cell.type = (i === 0 || i === path.length-1 || i % 2 === 0) ? "level" : "path";
    });
    // Set path between levels
    for (let i = 1; i < path.length; i++) {
        let cell = grid.find(g => g.q === path[i].q && g.r === path[i].r);
        if (cell && cell.type !== "level") cell.type = "path";
    }
}

function drawHexOverworld(grid, width, height) {
    const size = 16;
    const scaleY = 0.5;
    let hight_level = 0;
    let svg = `<svg width="${(width+1)*size*2}" height="${(height+1)*size*2}">`;
    for (const cell of grid) {
        const x = (cell.q + 1) * size * 1.5;
        // Für isometrische Ansicht y stärker staffeln
        const y = (cell.r + 1) * size * 0.89 + (cell.q % 2) * size * 0.5 + cell.h
        let color =
            cell.type === "level" ? "#ff0088" :
            cell.type === "path" ? "#24ffe9" : "#ccc";
        let color_bottom =
            cell.type === "level" ? "#dd0066" :
            cell.type === "path" ? "#04ddc7" : "#aaa";
        svg += `<polygon points="${hexPointsIso(x, y, size, scaleY)}"
            fill="${color}" stroke="#222" stroke-width="2"
            ${cell.type === "level" ? 'cursor="pointer"' : ""}
        />`;
        svg += `<polygon points="${hexPointsIso_bottom(x, y, size, scaleY)}"
            fill="${color_bottom}" stroke="#222" stroke-width="2"
            ${cell.type === "level" ? 'cursor="pointer"' : ""}
        />`;
    }
    svg += "</svg>";
    document.getElementById('overworld').innerHTML = svg;
}


function hexPoints(cx, cy, s) {
    let points = [];
    for (let a = 0; a < 6; a++) {
        let angle = Math.PI/3 * a;
        points.push([cx + s * Math.cos(angle), cy + s * Math.sin(angle)]);
    }
    return points.map(p => p.join(",")).join(" ");
}

function hexPointsIso(cx, cy, s, scaleY = 0.5) {
    let points = [];
    for (let a = 0; a < 6; a++) {
        let angle = Math.PI / 3 * a;
        let x = cx + s * Math.cos(angle);
        let y = cy + s * Math.sin(angle) * scaleY;
        points.push([x, y]);
    }
    return points.map(p => p.join(",")).join(" ");
}

function hexPointsIso_bottom(cx, cy, s, scaleY = 0.5) {
    let points = [];
    for (let a = 0; a < 4; a++) {
        let angle = Math.PI / 3 * a;
        let x = cx + s * Math.cos(angle);
        let y = cy + s * Math.sin(angle) * scaleY;
        points.push([x, y]);
    }
    for (let a = 3; a >= 0; a--) {
        let angle = Math.PI / 3 * a;
        let x = cx + s * Math.cos(angle);
        let y = cy + s * Math.sin(angle) * scaleY;
        y += 100
        points.push([x, y]);
    }
    return points.map(p => p.join(",")).join(" ");
}


// ---- MAIN ----
let grid = createHexGrid(gridWidth, gridHeight);
let path = createRandomPath(grid, gridWidth, gridHeight, numLevels);
setGridTypes(grid, path);
drawHexOverworld(grid, gridWidth, gridHeight);
</script>
