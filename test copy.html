<div id="overworld"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/simplex-noise/2.4.0/simplex-noise.min.js"></script>
<script>
const gridWidth = 16;
const gridHeight = 16;
const numLevels = 5;
const simplex = new SimplexNoise();

function createHexGrid(width, height) {
    const grid = [];
    let h = 0;
    for (let r = 0; r < height; r++) {
        for (let q = 0; q < width; q += 2) {
            grid.push({ q, r, h, type: "land" });
        }
        for (let q = 1; q < width; q += 2) {
            grid.push({ q, r, h, type: "land" });
        }
    }
    return grid;
}

// Simple random path generator for demonstration
function createRandomPath(grid, width, height, numLevels) {
    let path = [];
    let current = { q: 1, r: Math.floor(height / 2) };
    path.push(current);
    let r_increment = current.q % 2 === 0 ? 0 : 1;
    while (path.length < numLevels) {
        let options = [
            { q: current.q + 1, r: current.r },
            { q: current.q + 1, r: current.r + r_increment},
            { q: current.q + 1, r: current.r + (r_increment-1)},
            { q: current.q, r: current.r + r_increment},
            { q: current.q, r: current.r - r_increment},
        ].filter(({ q, r }) =>
            q >= 0 && q < width && r >= 0 && r < height
        );
        let next = options[Math.floor(Math.random() * options.length)];
        if (!path.find(p => p.q === next.q && p.r === next.r)) {
            path.push(next);
            current = next;
            r_increment = current.q % 2 === 0 ? 0 : 1;
        }
    }
    return path;
}

function hexDistance(a, b) {
    // Axiale Distanz, aber für odd-q Offset-Koordinaten angepasst
    // (Du kannst auch axial nehmen, wenn du umstellen willst)
    // s = -q - r
    const s1 = -a.q - a.r;
    const s2 = -b.q - b.r;
    return Math.max(
        Math.abs(a.q - b.q),
        Math.abs(a.r - b.r),
        Math.abs(s1 - s2)
    );
}

function generateIsland(grid, width, height, noiseScale=0.18, noiseStrength=0.16, radius=2.3) {
    // Mittelpunkt (am besten gerundet auf ganze Hex-Zellen)
    const center = { q: Math.floor((width - 1) / 2), r: Math.floor((height - 1) / 2) };

    // Finde maximalen Abstand
    let maxDist = 0;
    for (const cell of grid) {
        const dist = hexDistance(cell, center);
        if (dist > maxDist) maxDist = dist;
    }

    // SimplexNoise initialisieren (falls noch nicht gemacht)
    if (typeof simplex === "undefined") simplex = new SimplexNoise();

    // Höhe setzen: Berg in der Mitte, Wasser am Rand, mit Noise
    for (const cell of grid) {
        const dist = hexDistance(cell, center);
        let h = 1 - Math.pow(dist / maxDist*radius, 2);   // Parabelförmiger Berg
        // Simplex-Rauschen für Natürlichkeit
        h += simplex.noise2D(cell.q * noiseScale, cell.r * noiseScale) * noiseStrength;
        // Clamp zwischen 0...1
        h = Math.max(0, Math.min(1, h))*-100 + cell.h; // Negativ für Isometrie
        cell.h = h/2;
    }
}



function setGridTypes(grid, path) {
    path.forEach((node, i) => {
        let cell = grid.find(g => g.q === node.q && g.r === node.r);
        if (cell) cell.type = (i === 0 || i === path.length-1 || i % 2 === 0) ? "level" : "path";
    });
    // Set path between levels
    for (let i = 1; i < path.length; i++) {
        let cell = grid.find(g => g.q === path[i].q && g.r === path[i].r);
        if (cell && cell.type !== "level") cell.type = "path";
    }
}

function setGridTypeWater(grid, h_threshold = 0) {
    grid.forEach(cell => {
        if (cell.h >= h_threshold) {
            cell.type = "water";
        }
    });
}

function setGridTypeBeach(grid, h_threshold = 0) {
    grid.forEach(cell => {
        if (cell.h >= h_threshold && cell.type !== "water") {
            cell.type = "beach";
        }
    });
}

function setGridTypeGreen(grid, h_threshold = 0) {
    grid.forEach(cell => {
        if (cell.h >= h_threshold && cell.type !== "water" && cell.type !== "beach") {
            cell.type = "green";
        }
    });
}

function drawHexOverworld(grid, width, height) {
    const size = 32;
    const scaleY = 0.5;
    let hight_level = 0;
    let svg = `<svg width="${(width+1)*size*2}" height="${(height+1)*size*2}">`;
    for (const cell of grid) {
        const x = (cell.q + 1) * size * 1.5;
        // Für isometrische Ansicht y stärker staffeln
        const y = (cell.r + 1) * size * 0.89 + (cell.q % 2) * size * 0.5 + cell.h
        let color =
            cell.type === "level" ? "#ff0088" :
            cell.type === "path" ? "#24ffe9" : 
            cell.type === "water" ? "#00aaff" :
            cell.type === "beach" ? "#f0d6a0" : 
            cell.type === "green" ? "#00ff00" : "#ccc";
        let color_bottom =
            cell.type === "level" ? "#dd0066" :
            cell.type === "path" ? "#04ddc7" : 
            cell.type === "water" ? "#0088cc" : 
            cell.type === "beach" ? "#d0b080" :  
            cell.type === "green" ? "#00cc00" : "#aaa";
        svg += `<polygon points="${hexPointsIso(x, y, size, scaleY)}"
            fill="${color}" stroke="#222" stroke-width="2"
            ${cell.type === "level" ? 'cursor="pointer"' : ""}
        />`;
        svg += `<polygon points="${hexPointsIso_bottom(x, y, size, scaleY)}"
            fill="${color_bottom}" stroke="#222" stroke-width="2"
            ${cell.type === "level" ? 'cursor="pointer"' : ""}
        />`;
    }
    svg += "</svg>";
    document.getElementById('overworld').innerHTML = svg;
}


function hexPoints(cx, cy, s) {
    let points = [];
    for (let a = 0; a < 6; a++) {
        let angle = Math.PI/3 * a;
        points.push([cx + s * Math.cos(angle), cy + s * Math.sin(angle)]);
    }
    return points.map(p => p.join(",")).join(" ");
}

function hexPointsIso(cx, cy, s, scaleY = 0.5) {
    let points = [];
    for (let a = 0; a < 6; a++) {
        let angle = Math.PI / 3 * a;
        let x = cx + s * Math.cos(angle);
        let y = cy + s * Math.sin(angle) * scaleY;
        points.push([x, y]);
    }
    return points.map(p => p.join(",")).join(" ");
}

function hexPointsIso_bottom(cx, cy, s, scaleY = 0.5) {
    let points = [];
    for (let a = 0; a < 4; a++) {
        let angle = Math.PI / 3 * a;
        let x = cx + s * Math.cos(angle);
        let y = cy + s * Math.sin(angle) * scaleY;
        points.push([x, y]);
    }
    for (let a = 3; a >= 0; a--) {
        let angle = Math.PI / 3 * a;
        let x = cx + s * Math.cos(angle);
        let y = cy + s * Math.sin(angle) * scaleY;
        y += 100
        points.push([x, y]);
    }
    return points.map(p => p.join(",")).join(" ");
}


// ---- MAIN ----
let grid = createHexGrid(gridWidth, gridHeight);
generateIsland(grid, gridWidth, gridHeight, .18, .316, 2.3);
generateIsland(grid, gridWidth, gridHeight, .18, .316, 4);
generateIsland(grid, gridWidth, gridHeight, .18, .316, 8);
setGridTypeWater(grid,-2);
setGridTypeBeach(grid, -10);
setGridTypeGreen(grid, -50);
let path = createRandomPath(grid, gridWidth, gridHeight, numLevels);
setGridTypes(grid, path);
drawHexOverworld(grid, gridWidth, gridHeight);
</script>
