<?xml version="1.0" encoding="UTF-8"?>
<svg id="integrated_tau_tdu_open_cutaway_light_blue_gray_cavity" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 720" role="img" aria-label="Integrated open cutaway TAU TDU interface with light blue gray cutaway cavity and blue Twister">
  <defs>
    <linearGradient id="blueShell" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#dff1ff"/>
      <stop offset="24%" stop-color="#9fc8ea"/>
      <stop offset="58%" stop-color="#6fa7d4"/>
      <stop offset="100%" stop-color="#3f78ad"/>
    </linearGradient>
    <linearGradient id="blueShellDark" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#1d588f"/>
      <stop offset="58%" stop-color="#103f6b"/>
      <stop offset="100%" stop-color="#082b4d"/>
    </linearGradient>
    <linearGradient id="whiteInset" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="55%" stop-color="#f4f7fa"/>
      <stop offset="100%" stop-color="#dfe6ed"/>
    </linearGradient>
    <linearGradient id="metal" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0%" stop-color="#7f8790"/>
      <stop offset="15%" stop-color="#b8bec5"/>
      <stop offset="32%" stop-color="#eef2f5"/>
      <stop offset="49%" stop-color="#ffffff"/>
      <stop offset="66%" stop-color="#d7dde2"/>
      <stop offset="84%" stop-color="#9ea7af"/>
      <stop offset="100%" stop-color="#68727b"/>
    </linearGradient>
    <linearGradient id="darkCavity" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#d8e6f0"/>
      <stop offset="42%" stop-color="#b8cad8"/>
      <stop offset="100%" stop-color="#7f96aa"/>
    </linearGradient>
    <linearGradient id="tubeGreen" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0%" stop-color="#0d3b3e"/>
      <stop offset="38%" stop-color="#1b7d7d"/>
      <stop offset="65%" stop-color="#0e5b61"/>
      <stop offset="100%" stop-color="#092b2d"/>
    </linearGradient>
    <linearGradient id="glassTube" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0%" stop-color="#bfe8ff" stop-opacity="0.25"/>
      <stop offset="30%" stop-color="#ffffff" stop-opacity="0.54"/>
      <stop offset="55%" stop-color="#eaf8ff" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#60b9ed" stop-opacity="0.28"/>
    </linearGradient>
    <linearGradient id="heatedZone" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#ffdc7e" stop-opacity="0.96"/>
      <stop offset="45%" stop-color="#f08d34" stop-opacity="0.74"/>
      <stop offset="100%" stop-color="#7f261f" stop-opacity="0.34"/>
    </linearGradient>
    <linearGradient id="twisterFill" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0%" stop-color="#123a62" stop-opacity="0.86"/>
      <stop offset="34%" stop-color="#73d7ff" stop-opacity="0.96"/>
      <stop offset="68%" stop-color="#2d8fd2" stop-opacity="0.92"/>
      <stop offset="100%" stop-color="#0b2b48" stop-opacity="0.88"/>
    </linearGradient>
    <linearGradient id="glassReflect" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.25"/>
      <stop offset="35%" stop-color="#d5ecff" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.03"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="4" flood-color="#000000" flood-opacity="0.17"/>
    </filter>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4.8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
