<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- Background with rounded corners -->
  <rect width="128" height="128" rx="16" ry="16" fill="#1a588bff"/>
  
  <!-- Decorative gradient overlay -->
  <defs>
    <linearGradient id="tTestGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a588bff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#436b8bff;stop-opacity:1" />
    </linearGradient>
    
    <!-- Glow filter for the t -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <rect width="128" height="128" rx="16" ry="16" fill="url(#tTestGradient)"/>
  
  <!-- Large stylized "t" for t-test -->
  <text x="38" y="80" font-family="serif" font-size="68" font-weight="bold" font-style="italic" fill="#ffffff" filter="url(#glow)">t</text>
  
  <!-- Two overlapping distribution curves (representing two groups) -->
  <!-- Left curve (lighter blue) -->
  <path d="M 15,48 Q 25,35 35,38 Q 45,41 50,48 Q 45,55 35,58 Q 25,61 15,48 Z" 
        fill="#619accff" opacity="0.7" stroke="#ffffff" stroke-width="1"/>
  
  <!-- Right curve (darker blue) -->
  <path d="M 35,48 Q 45,35 55,38 Q 65,41 70,48 Q 65,55 55,58 Q 45,61 35,48 Z" 
        fill="#9efcff" opacity="0.7" stroke="#ffffff" stroke-width="1"/>
  
  <!-- Comparison arrows -->
  <line x1="25" y1="48" x2="18" y2="48" stroke="#f9844a" stroke-width="2" marker-end="url(#arrowLeft)"/>
  <line x1="60" y1="48" x2="67" y2="48" stroke="#f9844a" stroke-width="2" marker-end="url(#arrowRight)"/>
  
  <defs>
    <marker id="arrowLeft" markerWidth="8" markerHeight="8" refX="0" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M8,0 L8,6 L0,3 z" fill="#f9844a"/>
    </marker>
    <marker id="arrowRight" markerWidth="8" markerHeight="8" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L8,3 z" fill="#f9844a"/>
    </marker>
  </defs>
  
  <!-- Subscript notation -->
  <text x="68" y="85" font-family="serif" font-size="18" fill="#9efcff" font-style="italic">(n)</text>
  
  <!-- Statistical symbols at bottom -->
  <text x="10" y="115" font-family="sans-serif" font-size="16" font-weight="600" fill="#9efcff">μ₁ ≠ μ₂</text>
  
  <!-- Decorative element: significance level alpha -->
  <text x="85" y="115" font-family="serif" font-size="16" font-style="italic" fill="#f9844a">α = 0.05</text>
</svg>
