<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="512" height="512" aria-label="Cluster Analysis II" role="img">
  <rect x="2" y="2" width="124" height="124" rx="12" ry="12" fill="#bae6fd" stroke="#111827" stroke-width="2"/>

  <!-- Axes -->
  <g stroke="#111827" stroke-width="3" stroke-linecap="round">
    <line x1="26" y1="100" x2="102" y2="100"/>
    <line x1="26" y1="100" x2="26" y2="26"/>
  </g>

  <!-- Score clusters -->
  <g opacity="0.9">
    <circle cx="44" cy="78" r="6" fill="#ef4444"/>
    <circle cx="52" cy="70" r="5" fill="#ef4444"/>
    <circle cx="38" cy="68" r="4" fill="#ef4444"/>

    <circle cx="78" cy="52" r="6" fill="#22c55e"/>
    <circle cx="86" cy="60" r="5" fill="#22c55e"/>
    <circle cx="70" cy="60" r="4" fill="#22c55e"/>

    <circle cx="64" cy="86" r="6" fill="#0ea5e9"/>
    <circle cx="74" cy="92" r="5" fill="#0ea5e9"/>
    <circle cx="56" cy="92" r="4" fill="#0ea5e9"/>
  </g>

  <!-- Loading vectors -->
  <defs>
    <marker id="pca-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1f2937"/>
    </marker>
  </defs>
  <g stroke="#1f2937" stroke-width="2.5" stroke-linecap="round" marker-end="url(#pca-arrow)">
    <line x1="26" y1="100" x2="92" y2="44"/>
    <line x1="26" y1="100" x2="58" y2="32"/>
  </g>

  <!-- Ellipse to hint clustering -->
  <ellipse cx="64" cy="72" rx="40" ry="28" fill="none" stroke="#1d4ed8" stroke-width="2" stroke-dasharray="5 4" opacity="0.6"/>
</svg>
