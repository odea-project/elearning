<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- Dots showing spread -->
  <circle cx="50" cy="100" r="5" fill="white"/>
  <circle cx="75" cy="100" r="5" fill="white"/>
  <circle cx="95" cy="100" r="5" fill="white"/>
  <circle cx="105" cy="100" r="5" fill="white"/>
  <circle cx="125" cy="100" r="5" fill="white"/>
  <circle cx="150" cy="100" r="5" fill="white"/>
  
  <!-- Horizontal bars indicating range/spread -->
  <line x1="45" y1="130" x2="155" y2="130" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Left tick -->
  <line x1="45" y1="120" x2="45" y2="140" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Right tick -->
  <line x1="155" y1="120" x2="155" y2="140" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
  
  <!-- Double-headed arrow showing spread -->
  <path d="M 50 145 L 45 150 L 50 155" stroke="white" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 150 145 L 155 150 L 150 155" stroke="white" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="45" y1="150" x2="155" y2="150" stroke="white" stroke-width="2" stroke-linecap="round"/>
</svg>
