<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="512" height="512" aria-label="Cluster Analysis" role="img">
  <!-- Background with rounded corners -->
  <rect x="2" y="2" width="124" height="124" rx="12" ry="12" fill="#c4b5fd" stroke="#111827" stroke-width="2"/>
  
  <!-- Cluster 1 (top-left) - red/coral -->
  <circle cx="35" cy="38" r="8" fill="#ef4444" fill-opacity="0.85"/>
  <circle cx="48" cy="32" r="6" fill="#ef4444" fill-opacity="0.85"/>
  <circle cx="28" cy="48" r="5" fill="#ef4444" fill-opacity="0.85"/>
  <circle cx="42" cy="50" r="7" fill="#ef4444" fill-opacity="0.85"/>
  <circle cx="52" cy="44" r="5" fill="#ef4444" fill-opacity="0.85"/>
  
  <!-- Cluster 2 (top-right) - cyan -->
  <circle cx="88" cy="35" r="7" fill="#06b6d4" fill-opacity="0.85"/>
  <circle cx="100" cy="42" r="6" fill="#06b6d4" fill-opacity="0.85"/>
  <circle cx="78" cy="42" r="5" fill="#06b6d4" fill-opacity="0.85"/>
  <circle cx="92" cy="50" r="8" fill="#06b6d4" fill-opacity="0.85"/>
  <circle cx="104" cy="55" r="5" fill="#06b6d4" fill-opacity="0.85"/>
  
  <!-- Cluster 3 (bottom) - green -->
  <circle cx="55" cy="85" r="9" fill="#22c55e" fill-opacity="0.85"/>
  <circle cx="70" cy="78" r="7" fill="#22c55e" fill-opacity="0.85"/>
  <circle cx="42" cy="92" r="6" fill="#22c55e" fill-opacity="0.85"/>
  <circle cx="62" cy="98" r="5" fill="#22c55e" fill-opacity="0.85"/>
  <circle cx="78" cy="92" r="8" fill="#22c55e" fill-opacity="0.85"/>
  <circle cx="85" cy="82" r="5" fill="#22c55e" fill-opacity="0.85"/>
  
  <!-- Centroid markers (X marks) -->
  <g stroke="#581c87" stroke-width="2.5" stroke-linecap="round">
    <!-- Centroid 1 -->
    <line x1="36" y1="38" x2="44" y2="46"/>
    <line x1="44" y1="38" x2="36" y2="46"/>
    <!-- Centroid 2 -->
    <line x1="86" y1="42" x2="94" y2="50"/>
    <line x1="94" y1="42" x2="86" y2="50"/>
    <!-- Centroid 3 -->
    <line x1="60" y1="84" x2="68" y2="92"/>
    <line x1="68" y1="84" x2="60" y2="92"/>
  </g>
  
  <!-- Dashed cluster boundaries (ellipses) -->
  <ellipse cx="40" cy="42" rx="28" ry="20" fill="none" stroke="#7c3aed" stroke-width="1.5" stroke-dasharray="4 3" opacity="0.6"/>
  <ellipse cx="90" cy="46" rx="24" ry="20" fill="none" stroke="#7c3aed" stroke-width="1.5" stroke-dasharray="4 3" opacity="0.6"/>
  <ellipse cx="64" cy="88" rx="32" ry="22" fill="none" stroke="#7c3aed" stroke-width="1.5" stroke-dasharray="4 3" opacity="0.6"/>
</svg>
