<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 128 128"
     width="512"
     height="512"
     aria-label="Machine Learning"
     role="img">

  <!-- Background with rounded corners -->
  <rect x="2" y="2" width="124" height="124" rx="12" ry="12"
        fill="#93c5fd" stroke="#111827" stroke-width="2"/>

  <!-- Axes -->
  <line x1="16" y1="22" x2="16" y2="108"
        stroke="#1e3a8a" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="16" y1="108" x2="112" y2="108"
        stroke="#1e3a8a" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Nonlinear boundary / probability transition -->
  <path d="M22 100
           C 44 98, 52 84, 60 72
           C 70 58, 82 44, 108 30"
        fill="none" stroke="#0ea5e9" stroke-width="4"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Soft band (uncertainty) -->
  <path d="M22 106
           C 44 104, 52 90, 60 78
           C 70 64, 82 50, 108 36
           L108 24
           C 82 38, 70 52, 60 66
           C 52 78, 44 92, 22 94 Z"
        fill="#0ea5e9" opacity="0.18"/>

  <!-- Example points (two classes) -->
  <g stroke="#111827" stroke-width="1.5">
    <circle cx="26" cy="92" r="4.5" fill="#22c55e"/>
    <circle cx="34" cy="98" r="4.5" fill="#22c55e"/>
    <circle cx="46" cy="86" r="4.5" fill="#22c55e"/>

    <circle cx="58" cy="84" r="4.5" fill="#f97316"/>
    <circle cx="76" cy="54" r="4.5" fill="#f97316"/>
    <circle cx="96" cy="44" r="4.5" fill="#f97316"/>
  </g>

  <!-- Small tree/forest hint (top-right) -->
  <g stroke="#111827" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" opacity="0.95">
    <line x1="92" y1="26" x2="80" y2="38"/>
    <line x1="92" y1="26" x2="104" y2="38"/>
    <line x1="80" y1="38" x2="74" y2="52"/>
    <line x1="80" y1="38" x2="86" y2="52"/>
    <line x1="104" y1="38" x2="98" y2="52"/>
    <line x1="104" y1="38" x2="110" y2="52"/>
  </g>
  <g fill="#ffffff" stroke="#111827" stroke-width="2">
    <circle cx="92" cy="26" r="4.8"/>
    <circle cx="80" cy="38" r="4.4"/>
    <circle cx="104" cy="38" r="4.4"/>
    <rect x="70" y="52" width="10" height="8" rx="3"/>
    <rect x="82" y="52" width="10" height="8" rx="3"/>
    <rect x="94" y="52" width="10" height="8" rx="3"/>
    <rect x="106" y="52" width="10" height="8" rx="3"/>
  </g>

</svg>
