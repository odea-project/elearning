<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="512" height="512" aria-labelledby="title desc" role="img">
  <title id="title">Moments Icon</title>
  <desc id="desc">Minimalist icon showing a skewed density curve with mean line, variance spread, skewness arrow, and kurtosis marker.</desc>

  <!-- Card background -->
  <rect x="2" y="2" width="124" height="124" rx="12" ry="12" fill="white" stroke="#111827" stroke-width="2"/>

  <!-- Axes -->
  <line x1="16" y1="104" x2="112" y2="104" stroke="#6B7280" stroke-width="2" stroke-linecap="round"/>
  <line x1="16" y1="28" x2="16" y2="104" stroke="#6B7280" stroke-width="2" stroke-linecap="round"/>

  <!-- Skewed density curve -->
  <path d="M16 100
           C 30 98, 36 90, 46 84
           C 58 76, 70 60, 82 54
           C 96 48, 104 60, 112 100"
        fill="none" stroke="#0EA5E9" stroke-width="3" stroke-linecap="round"/>

  <!-- Mean line (µ) -->
  <line x1="66" y1="44" x2="66" y2="104" stroke="#2563EB" stroke-width="2" stroke-dasharray="4 3"/>
  <text x="66" y="40" text-anchor="middle"
        font-family="system-ui, -apple-system, Segoe UI, Roboto, Ubuntu, Cantarell, Noto Sans, Helvetica, Arial, sans-serif"
        font-size="10" fill="#2563EB">µ</text>

  <!-- Variance spread (double arrow around mean) -->
  <g stroke="#2563EB" stroke-width="2" fill="none">
    <line x1="46" y1="94" x2="86" y2="94"/>
    <path d="M46 94 l6 -4 l0 8 z"/>
    <path d="M86 94 l-6 -4 l0 8 z"/>
  </g>
  <text x="66" y="108" text-anchor="middle"
        font-family="system-ui, -apple-system, Segoe UI, Roboto, Ubuntu, Cantarell, Noto Sans, Helvetica, Arial, sans-serif"
        font-size="8" fill="#2563EB" opacity="0.9">variance</text>

  <!-- Skewness cue (curved arrow) -->
  <path d="M82 62
           C 88 64, 92 70, 92 78"
        fill="none" stroke="#F59E0B" stroke-width="2" stroke-linecap="round"/>
  <path d="M92 78 l-3 -6 l8 0 z" fill="#F59E0B"/>

  <!-- Kurtosis cue (diamond marker at peak) -->
  <rect x="80" y="52" width="8" height="8" transform="rotate(45 84 56)"
        fill="#10B981" stroke="#059669" stroke-width="1.5"/>

  <!-- Subtle histogram backdrop (faint bars) -->
  <g fill="#3B82F6" fill-opacity="0.12" stroke="#93C5FD" stroke-opacity="0.5" stroke-width="1">
    <rect x="24" y="88" width="8" height="16" rx="1"/>
    <rect x="36" y="78" width="8" height="26" rx="1"/>
    <rect x="48" y="66" width="8" height="38" rx="1"/>
    <rect x="60" y="56" width="8" height="48" rx="1"/>
    <rect x="72" y="50" width="8" height="54" rx="1"/>
    <rect x="84" y="62" width="8" height="42" rx="1"/>
    <rect x="96" y="80" width="8" height="24" rx="1"/>
  </g>

  <!-- Title -->
  <text x="64" y="20" text-anchor="middle" font-family="system-ui, -apple-system, Segoe UI, Roboto, Ubuntu, Cantarell, Noto Sans, Helvetica, Arial, sans-serif"
        font-size="10" fill="#111827" opacity="0.85">Moments</text>
</svg>
