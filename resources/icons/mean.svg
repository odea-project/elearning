<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- Cloud of points -->
  <circle cx="70" cy="80" r="4" fill="white"/>
  <circle cx="85" cy="95" r="4" fill="white"/>
  <circle cx="110" cy="75" r="4" fill="white"/>
  <circle cx="95" cy="105" r="4" fill="white"/>
  <circle cx="120" cy="90" r="4" fill="white"/>
  <circle cx="80" cy="115" r="4" fill="white"/>
  <circle cx="130" cy="110" r="4" fill="white"/>
  <circle cx="105" cy="85" r="4" fill="white"/>
  <circle cx="115" cy="120" r="4" fill="white"/>
  <circle cx="90" cy="70" r="4" fill="white"/>
  <circle cx="125" cy="100" r="4" fill="white"/>
  <circle cx="75" cy="100" r="4" fill="white"/>
  
  <!-- Cross marking the mean -->
  <line x1="85" y1="95" x2="115" y2="95" stroke="white" stroke-width="3" stroke-linecap="round"/>
  <line x1="100" y1="80" x2="100" y2="110" stroke="white" stroke-width="3" stroke-linecap="round"/>
  
  <!-- Mean point -->
  <circle cx="100" cy="95" r="6" fill="white" opacity="0.9"/>
</svg>
