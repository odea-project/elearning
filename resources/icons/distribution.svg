<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="512" height="512" aria-labelledby="title desc" role="img">
  <title id="title">Distribution Icon</title>
  <desc id="desc">Minimalist histogram bars with an overlaid smooth density curve.</desc>

  <!-- Background -->
  <rect x="2" y="2" width="124" height="124" rx="12" ry="12" fill="white" stroke="#111827" stroke-width="2"/>

  <!-- Axes -->
  <line x1="16" y1="104" x2="112" y2="104" stroke="#6B7280" stroke-width="2" stroke-linecap="round"/>
  <line x1="16" y1="28" x2="16" y2="104" stroke="#6B7280" stroke-width="2" stroke-linecap="round"/>

  <!-- Histogram bars -->
  <g fill="#3B82F6" fill-opacity="0.20" stroke="#2563EB" stroke-width="2">
    <rect x="22" y="84" width="12" height="20" rx="2"/>
    <rect x="38" y="72" width="12" height="32" rx="2"/>
    <rect x="54" y="58" width="12" height="46" rx="2"/>
    <rect x="70" y="48" width="12" height="56" rx="2"/>
    <rect x="86" y="58" width="12" height="46" rx="2"/>
    <rect x="102" y="76" width="12" height="28" rx="2"/>
  </g>

  <!-- Density curve (smooth) -->
  <path d="M16 100
           C 28 98, 32 90, 40 84
           C 48 78, 54 64, 64 58
           C 74 52, 82 58, 92 68
           C 100 76, 106 90, 112 100"
        fill="none" stroke="#0EA5E9" stroke-width="3" stroke-linecap="round"/>

  <!-- Ticks (subtle) -->
  <g stroke="#D1D5DB" stroke-width="1">
    <line x1="32" y1="104" x2="32" y2="108"/>
    <line x1="48" y1="104" x2="48" y2="108"/>
    <line x1="64" y1="104" x2="64" y2="108"/>
    <line x1="80" y1="104" x2="80" y2="108"/>
    <line x1="96" y1="104" x2="96" y2="108"/>
    <line x1="112" y1="104" x2="112" y2="108"/>
  </g>

  <!-- Label -->
  <text x="64" y="20" text-anchor="middle" font-family="system-ui, -apple-system, Segoe UI, Roboto, Ubuntu, Cantarell, Noto Sans, Helvetica, Arial, sans-serif"
        font-size="10" fill="#111827" opacity="0.8">Distribution</text>
</svg>
