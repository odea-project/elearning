<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 128 128"
     width="512"
     height="512"
     aria-label="ANOVA"
     role="img">

  <!-- Background with rounded corners -->
  <rect x="2" y="2" width="124" height="124" rx="12" ry="12"
        fill="#a5f3fcff" stroke="#111827" stroke-width="2"/>

  <!-- Axes -->
  <line x1="16" y1="28" x2="16" y2="104"
        stroke="#075985ff" stroke-width="2" stroke-linecap="round"/>
  <line x1="16" y1="104" x2="112" y2="104"
        stroke="#075985ff" stroke-width="2" stroke-linecap="round"/>

  <!-- Smooth line connecting group centers (between-group effect) -->
  <path d="
      M28 70
      Q 44 50, 60 64
      T 92 52"
        fill="none"
        stroke="#0e7490ff"
        stroke-width="2.5"
        stroke-linecap="round"
        stroke-linejoin="round"
        opacity="0.9"/>

  <!-- Group 1: box + whiskers -->
  <g stroke="#0e7490ff" stroke-width="2" fill="#0ea5e9ff" fill-opacity="0.35">
    <!-- whiskers -->
    <line x1="28" y1="60" x2="28" y2="84" stroke-linecap="round"/>
    <!-- box -->
    <rect x="22" y="66" width="12" height="16" rx="2" ry="2"/>
    <!-- median line -->
    <line x1="22" y1="74" x2="34" y2="74" stroke-width="2.2"/>
  </g>

  <!-- Group 2: box + whiskers -->
  <g stroke="#0e7490ff" stroke-width="2" fill="#0ea5e9ff" fill-opacity="0.35">
    <line x1="60" y1="54" x2="60" y2="78" stroke-linecap="round"/>
    <rect x="54" y="60" width="12" height="16" rx="2" ry="2"/>
    <line x1="54" y1="68" x2="66" y2="68" stroke-width="2.2"/>
  </g>

  <!-- Group 3: box + whiskers -->
  <g stroke="#0e7490ff" stroke-width="2" fill="#0ea5e9ff" fill-opacity="0.35">
    <line x1="92" y1="46" x2="92" y2="70" stroke-linecap="round"/>
    <rect x="86" y="52" width="12" height="16" rx="2" ry="2"/>
    <line x1="86" y1="60" x2="98" y2="60" stroke-width="2.2"/>
  </g>

  <!-- Subtle within-group emphasis: small vertical double-arrows inside boxes -->
  <g stroke="#0e7490ff" stroke-width="1.6" stroke-linecap="round">
    <!-- Group 1 within -->
    <line x1="28" y1="68" x2="28" y2="82"/>
    <path d="M28 68 l-3 3 M28 68 l3 3"/>
    <path d="M28 82 l-3 -3 M28 82 l3 -3"/>

    <!-- Group 2 within -->
    <line x1="60" y1="62" x2="60" y2="74"/>
    <path d="M60 62 l-3 3 M60 62 l3 3"/>
    <path d="M60 74 l-3 -3 M60 74 l3 -3"/>

    <!-- Group 3 within -->
    <line x1="92" y1="54" x2="92" y2="64"/>
    <path d="M92 54 l-3 3 M92 54 l3 3"/>
    <path d="M92 64 l-3 -3 M92 64 l3 -3"/>
  </g>

</svg>
