<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="512" height="512" aria-label="Hypothesis Testing" role="img">
  <rect x="2" y="2" width="124" height="124" rx="12" ry="12" fill="#9d4eddff" stroke="#111827" stroke-width="2"/>
  
  <!-- Axes -->
  <line x1="16" y1="28" x2="16" y2="104" stroke="#3c096cff" stroke-width="2" stroke-linecap="round"/>
  <line x1="16" y1="104" x2="112" y2="104" stroke="#3c096cff" stroke-width="2" stroke-linecap="round"/>
  
  <!-- Normal distribution curve -->
  <path d="M16 100 C 28 96, 40 80, 52 60 C 64 40, 76 60, 88 80 C 100 96, 112 100, 112 100" 
        fill="none" stroke="#7209b7ff" stroke-width="3" stroke-linecap="round"/>
  
  <!-- Shaded rejection regions (left tail) -->
  <path d="M16 100 C 20 98, 24 92, 28 86 L28 104 L16 104 Z" 
        fill="#e0aaff" fill-opacity="0.5" stroke="none"/>
  
  <!-- Shaded rejection regions (right tail) -->
  <path d="M100 86 C 104 92, 108 98, 112 100 L112 104 L100 104 Z" 
        fill="#e0aaff" fill-opacity="0.5" stroke="none"/>
  
  <!-- Critical value markers -->
  <line x1="28" y1="86" x2="28" y2="104" stroke="#c77dffff" stroke-width="2" stroke-dasharray="3 2"/>
  <line x1="100" y1="86" x2="100" y2="104" stroke="#c77dffff" stroke-width="2" stroke-dasharray="3 2"/>
  
  <!-- Center line (H0) -->
  <line x1="64" y1="40" x2="64" y2="104" stroke="#5a189aff" stroke-width="2" stroke-dasharray="4 3"/>
  
  <!-- H0 label -->
  <text x="64" y="35" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#240046ff" text-anchor="middle">H₀</text>
  
  <!-- Alpha symbols -->
  <text x="22" y="82" font-family="Arial, sans-serif" font-size="10" fill="#5a189aff" text-anchor="middle">α</text>
  <text x="106" y="82" font-family="Arial, sans-serif" font-size="10" fill="#5a189aff" text-anchor="middle">α</text>
</svg>
