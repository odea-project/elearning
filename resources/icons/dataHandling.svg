<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- Document/file icon representing CSV -->
  <rect x="50" y="30" width="50" height="65" fill="none" stroke="white" stroke-width="2.5" rx="3"/>
  <!-- Lines representing CSV rows -->
  <line x1="60" y1="45" x2="90" y2="45" stroke="white" stroke-width="2" stroke-linecap="round"/>
  <line x1="60" y1="55" x2="90" y2="55" stroke="white" stroke-width="2" stroke-linecap="round"/>
  <line x1="60" y1="65" x2="90" y2="65" stroke="white" stroke-width="2" stroke-linecap="round"/>
  <line x1="60" y1="75" x2="90" y2="75" stroke="white" stroke-width="2" stroke-linecap="round"/>
  <line x1="60" y1="85" x2="80" y2="85" stroke="white" stroke-width="2" stroke-linecap="round"/>
  
  <!-- Curly braces representing JSON -->
  <path d="M 105 35 Q 100 35 100 40 L 100 50 Q 100 55 95 55 Q 100 55 100 60 L 100 85 Q 100 90 105 90" 
        fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M 145 35 Q 150 35 150 40 L 150 50 Q 150 55 155 55 Q 150 55 150 60 L 150 85 Q 150 90 145 90" 
        fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Key-value pairs in JSON -->
  <line x1="115" y1="50" x2="135" y2="50" stroke="white" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="115" y1="60" x2="135" y2="60" stroke="white" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="115" y1="70" x2="135" y2="70" stroke="white" stroke-width="1.5" stroke-linecap="round"/>
  <circle cx="110" cy="50" r="1.5" fill="white"/>
  <circle cx="110" cy="60" r="1.5" fill="white"/>
  <circle cx="110" cy="70" r="1.5" fill="white"/>
  
  <!-- Arrow pointing down to data frame -->
  <path d="M 100 105 L 100 115" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M 95 110 L 100 115 L 105 110" stroke="white" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Data frame/table -->
  <rect x="45" y="125" width="110" height="50" fill="none" stroke="white" stroke-width="2.5" rx="3"/>
  <!-- Table grid -->
  <line x1="45" y1="140" x2="155" y2="140" stroke="white" stroke-width="2" stroke-linecap="round"/>
  <line x1="80" y1="125" x2="80" y2="175" stroke="white" stroke-width="2" stroke-linecap="round"/>
  <line x1="120" y1="125" x2="120" y2="175" stroke="white" stroke-width="2" stroke-linecap="round"/>
  
  <!-- μ (mu) symbol for mean -->
  <text x="58" y="165" font-family="Arial, sans-serif" font-size="18" fill="white" font-style="italic">μ</text>
  <!-- σ (sigma) symbol for standard deviation -->
  <text x="95" y="165" font-family="Arial, sans-serif" font-size="18" fill="white" font-style="italic">σ</text>
  <!-- Σ (capital sigma) for sum -->
  <text x="133" y="165" font-family="Arial, sans-serif" font-size="18" fill="white" font-weight="bold">Σ</text>
</svg>
