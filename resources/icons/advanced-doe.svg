<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 128 128"
     width="512"
     height="512"
     aria-label="Advanced Experimental Design"
     role="img">

  <!-- Background with rounded corners -->
  <rect x="2" y="2" width="124" height="124" rx="12" ry="12"
        fill="#dbeafe" stroke="#111827" stroke-width="2"/>

  <!-- Response Surface (curved mesh) -->
  <g stroke="#3b82f6" stroke-width="1" fill="none" opacity="0.6">
    <!-- Horizontal curves (showing curvature) -->
    <path d="M 20 75 Q 45 55, 64 50 Q 83 45, 108 65"/>
    <path d="M 20 85 Q 45 65, 64 60 Q 83 55, 108 75"/>
    <path d="M 20 95 Q 45 80, 64 75 Q 83 70, 108 85"/>
    <!-- Vertical curves -->
    <path d="M 30 95 Q 32 70, 35 55"/>
    <path d="M 50 90 Q 52 62, 55 48"/>
    <path d="M 70 88 Q 72 58, 75 45"/>
    <path d="M 90 92 Q 92 65, 95 52"/>
  </g>

  <!-- Optimum point (peak of response surface) -->
  <circle cx="64" cy="45" r="8" fill="#22c55e" stroke="#ffffff" stroke-width="2"/>
  
  <!-- Screening funnel (top left) - many factors to few -->
  <g transform="translate(15, 12)">
    <!-- Many small dots (many factors) -->
    <circle cx="5" cy="5" r="3" fill="#f59e0b"/>
    <circle cx="15" cy="3" r="3" fill="#f59e0b"/>
    <circle cx="25" cy="6" r="3" fill="#f59e0b"/>
    <circle cx="10" cy="12" r="3" fill="#f59e0b"/>
    <circle cx="20" cy="14" r="3" fill="#f59e0b"/>
    <circle cx="30" cy="10" r="3" fill="#f59e0b"/>
    <!-- Arrow pointing down -->
    <path d="M 17 20 L 17 32 L 12 27 M 17 32 L 22 27" stroke="#1e40af" stroke-width="2" fill="none"/>
  </g>

  <!-- Box-Behnken style points (right side) - edge midpoints, no corners -->
  <g transform="translate(75, 10)">
    <!-- Small cube outline -->
    <g stroke="#6366f1" stroke-width="1" fill="none" opacity="0.4">
      <polygon points="10,25 30,15 30,35 10,45"/>
      <polygon points="30,15 45,25 45,45 30,35"/>
      <line x1="10" y1="25" x2="25" y2="35"/>
    </g>
    <!-- Edge midpoints (BBD style) - not at corners -->
    <circle cx="20" cy="20" r="4" fill="#8b5cf6" stroke="#fff" stroke-width="1.5"/>
    <circle cx="37" cy="20" r="4" fill="#8b5cf6" stroke="#fff" stroke-width="1.5"/>
    <circle cx="20" cy="40" r="4" fill="#8b5cf6" stroke="#fff" stroke-width="1.5"/>
    <circle cx="37" cy="40" r="4" fill="#8b5cf6" stroke="#fff" stroke-width="1.5"/>
    <circle cx="10" cy="35" r="4" fill="#8b5cf6" stroke="#fff" stroke-width="1.5"/>
    <circle cx="45" cy="35" r="4" fill="#8b5cf6" stroke="#fff" stroke-width="1.5"/>
    <!-- Center point -->
    <circle cx="28" cy="30" r="3" fill="#22c55e" stroke="#fff" stroke-width="1"/>
  </g>

  <!-- Plackett-Burman style matrix pattern (bottom left) -->
  <g transform="translate(12, 85)">
    <!-- Simplified +/- pattern grid -->
    <rect x="0" y="0" width="40" height="28" rx="3" fill="#fef3c7" stroke="#d97706" stroke-width="1"/>
    <!-- Plus signs -->
    <g fill="#16a34a" font-size="8" font-weight="bold">
      <text x="5" y="10">+</text>
      <text x="15" y="10">+</text>
      <text x="25" y="10">−</text>
      <text x="35" y="10">+</text>
      <text x="5" y="20">−</text>
      <text x="15" y="20">+</text>
      <text x="25" y="20">+</text>
      <text x="35" y="20">−</text>
    </g>
  </g>

  <!-- Fractional notation indicator (bottom right) -->
  <g transform="translate(70, 95)">
    <rect x="0" y="0" width="42" height="22" rx="4" fill="#e0e7ff" stroke="#4f46e5" stroke-width="1.5"/>
    <!-- 2^(k-p) style indicator with subscript -->
    <text x="21" y="16" text-anchor="middle" fill="#3730a3" font-size="11" font-weight="bold">2ᵏ⁻ᵖ</text>
  </g>

</svg>
