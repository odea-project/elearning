<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 128 128"
     width="512"
     height="512"
     aria-label="Linear Regression"
     role="img">

  <!-- Background with rounded corners -->
  <rect x="2" y="2" width="124" height="124" rx="12" ry="12"
        fill="#86efacff" stroke="#111827" stroke-width="2"/>

  <!-- Axes -->
  <line x1="16" y1="20" x2="16" y2="104"
        stroke="#166534ff" stroke-width="2" stroke-linecap="round"/>
  <line x1="16" y1="104" x2="112" y2="104"
        stroke="#166534ff" stroke-width="2" stroke-linecap="round"/>

  <!-- Prediction interval band (wider, orange) -->
  <path d="M20 98 L108 32 L108 48 L20 108 Z"
        fill="#fb923cff"
        opacity="0.25"/>

  <!-- Confidence interval band (narrower, teal) -->
  <path d="M20 100 L108 38 L108 44 L20 104 Z"
        fill="#14b8a6ff"
        opacity="0.4"/>

  <!-- Regression line -->
  <line x1="20" y1="102" x2="108" y2="40"
        stroke="#15803dff"
        stroke-width="3"
        stroke-linecap="round"/>

  <!-- Data points (scattered around the line) -->
  <circle cx="28" cy="94" r="5" fill="#ffffff" stroke="#ec4899ff" stroke-width="2"/>
  <circle cx="38" cy="88" r="5" fill="#ffffff" stroke="#ec4899ff" stroke-width="2"/>
  <circle cx="48" cy="78" r="5" fill="#ffffff" stroke="#ec4899ff" stroke-width="2"/>
  <circle cx="58" cy="74" r="5" fill="#ffffff" stroke="#ec4899ff" stroke-width="2"/>
  <circle cx="70" cy="62" r="5" fill="#ffffff" stroke="#ec4899ff" stroke-width="2"/>
  <circle cx="82" cy="58" r="5" fill="#ffffff" stroke="#ec4899ff" stroke-width="2"/>
  <circle cx="94" cy="48" r="5" fill="#ffffff" stroke="#ec4899ff" stroke-width="2"/>
  <circle cx="104" cy="44" r="5" fill="#ffffff" stroke="#ec4899ff" stroke-width="2"/>

</svg>
