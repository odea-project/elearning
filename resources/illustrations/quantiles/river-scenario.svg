<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200">
  <defs>
    <linearGradient id="waterGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#9efcff;stop-opacity:0.6"/>
      <stop offset="100%" style="stop-color:#1a2340;stop-opacity:0.8"/>
    </linearGradient>
  </defs>
  
  <rect width="320" height="200" fill="#f7f9fc"/>
  
  <!-- River banks -->
  <path d="M20 80 Q80 70 160 75 T300 80" fill="none" stroke="#555" stroke-width="2"/>
  <path d="M20 150 Q80 155 160 150 T300 145" fill="none" stroke="#555" stroke-width="2"/>
  
  <!-- Water -->
  <path d="M20 80 Q80 70 160 75 T300 80 L300 145 Q240 150 160 150 T20 150 Z" 
        fill="url(#waterGrad)" opacity="0.7"/>
  
  <!-- Temperature markers (thermometer icons) -->
  <circle cx="80" cy="110" r="4" fill="#702914"/>
  <circle cx="160" cy="115" r="4" fill="#702914"/>
  <circle cx="240" cy="112" r="4" fill="#702914"/>
  
  <!-- Thermometer lines -->
  <line x1="80" y1="90" x2="80" y2="110" stroke="#702914" stroke-width="2"/>
  <line x1="160" y1="95" x2="160" y2="115" stroke="#702914" stroke-width="2"/>
  <line x1="240" y1="92" x2="240" y2="112" stroke="#702914" stroke-width="2"/>
  
  <!-- Labels -->
  <text x="160" y="30" text-anchor="middle" font-size="16" fill="#09414d" font-family="Segoe UI, sans-serif" font-weight="600">River Temperature Monitoring</text>
  <text x="160" y="180" text-anchor="middle" font-size="13" fill="#555" font-family="Segoe UI, sans-serif">Tracking extreme temperatures across years</text>
</svg>
